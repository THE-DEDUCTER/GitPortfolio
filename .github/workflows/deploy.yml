name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        id: setup_pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        if: steps.setup_pages.outcome == 'success'
        with:
          # Upload root directory containing index.html and assets
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.setup_pages.outcome == 'success'
        uses: actions/deploy-pages@v4

      - name: Configuration Reminder
        if: steps.setup_pages.outcome != 'success'
        run: |
          echo "========================================================="
          echo "⚠️ GITHUB PAGES IS NOT YET CONFIGURED FOR ACTIONS ⚠️"
          echo "========================================================="
          echo "To fix this and deploy your portfolio:"
          echo "1. Go to your repository Settings -> Pages"
          echo "2. Under 'Build and deployment' -> 'Source', select 'GitHub Actions'"
          echo "3. Go to the Actions tab and re-run this workflow."
          echo "========================================================="
